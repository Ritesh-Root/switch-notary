# Agora Notary desk: the rooms half (a Switch group of two linked rooms).
# GENERATED by scripts/console-template.py from desk.rooms.yaml: apply it in Switch Console.
version: 1
params:
  team:
    type: string
    description: Prefix for the rooms
    default: acme
  builder:
    type: string
    description: The builder agent's name
    default: acme-builder
  reviewer:
    type: string
    description: The reviewer agent's name
    default: acme-reviewer
  notary:
    type: string
    description: The Notary agent's name (registered by scripts/register.sh)
    default: agora-notary
  location:
    type: location
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's own working folder
    default: "{$agents_dir}/{agent}"
    input: advanced
agents:
  - name: "{builder}"
    display_name: Builder
    description: Fixes work orders in acme-invoices and reports to the Notary with a claims block
    provider: claude
    location: "{location}"
    directory: "{directory}"
    repo: https://github.com/Ritesh-Root/acme-invoices
    addressing: owner-agents
    instructions: |
      You are the builder on this desk. You work only in the work room, and only on
      work orders the Notary gives you. For each one:
      1. Read the work order's room document and the Desk Policy and Reporting Contract documents.
      2. Fix it in the acme-invoices folder in your directory, on the branch the work order names,
         starting from the base it names. Don't edit the files the Desk Policy protects;
         put new tests in new files.
      3. Run the full test suite as one plain command: pytest -q
      4. Commit, push the branch, and report to the Notary in the work room. End your
         message with one notary-claims block: commit_pushed, files_changed (every path
         you changed or added), tests_passed, check_ran. Use the full 40-character sha.
      Claim only what you ran or saw. If the Notary bounces your report, fix what its
      codes say and report again.
  - name: "{reviewer}"
    display_name: Reviewer
    description: Reviews the builder's change at the reported commit and reports to the Notary
    provider: opencode
    location: "{location}"
    directory: "{directory}"
    repo: https://github.com/Ritesh-Root/acme-invoices
    addressing: owner-agents
    instructions: |
      You are the reviewer on this desk. When the Notary asks you to review a work
      order: fetch the branch it names in the acme-invoices folder in your directory,
      run git diff main...<sha> to read the change, and run the full suite as one plain
      command: pytest -q. Then report to the Notary in the work room with one
      notary-claims block: reviewed_diff (the sha) and check_ran (the command and
      whether it passed). Say plainly if you think the change is wrong.
group:
  name: "{team} desk"
  description: Requests and approvals in the desk; agents work in the work room; the Notary checks everything in between
rooms:
  - name: "{team}-desk"
    description: File work orders here. Only results the Notary has checked come back.
    channel_type: channel_public
    agents: ["{notary}"]
    users: ["{$creator}"]
    instructions: |
      This is the desk. People file work orders by addressing the Notary:
      "new <what's wrong and how to tell it's fixed>". Also "status" and "show WO-1".
      The builder and reviewer are not in this room on purpose: everything here was
      checked by the Notary against git, its own test run and Switch's tool log.
      Only the approvers in the Desk Policy can approve a work order.
  - name: "{team}-work"
    description: Builder, reviewer and Notary. Reports end with a notary-claims block.
    channel_type: channel_private
    agents: ["{builder}", "{reviewer}", "{notary}"]
    users: ["{$creator}"]
    instructions: |
      Work orders arrive here from the Notary. Read the work order's room document
      and the Reporting Contract before you report. Every report to the Notary ends
      with exactly one notary-claims block. Claim only what you ran or saw: the
      Notary checks each claim against git, its own run of the tests, and Switch's
      record of the commands you ran, and sends contradicted reports back.
    kickoff: |
      @{builder} @{reviewer} this is the {team} work room. Say hello in one line, then read
      the Desk Policy and Reporting Contract documents. Wait for work orders from the Notary.
    docs:
      - name: Desk Policy
        description: Who approves, how acceptance is checked, which files are off limits
        instructions: Read before working on or judging any work order. The Notary reads the block below.
        content: |
          # Desk Policy

          - Approvers: priya
          - Acceptance check: `pytest -q`, the full suite. The Notary runs it itself, at the sha you report, with no network.
          - Don't edit the existing tests or the build config. Put new tests in new files.
          - A work order can be bounced back to the builder twice; after that a person decides.

          ```notary-policy
          {"protocol":"notary-policy/1","approvers":["priya"],"acceptance":["pytest","-q"],"protected":["tests/test_money.py","tests/test_tax.py","tests/test_reports.py","conftest.py","pyproject.toml",".github/**","*.lock"],"max_bounces":2}
          ```
      - name: Reporting Contract
        description: The claims block every report to the Notary ends with
        instructions: Read before your first report.
        content: |
          # Reporting Contract

          End every report to the Notary with exactly one fenced block tagged `notary-claims`
          holding strict JSON. Use the full 40-character sha you pushed.

          ```
          {"protocol":"notary-claims/1","wo":"WO-1","sha":"<40 hex>","claims":[
           {"id":"c1","kind":"commit_pushed","branch":"wo-1","sha":"<40 hex>"},
           {"id":"c2","kind":"files_changed","paths":["src/invoices/tax.py"]},
           {"id":"c3","kind":"tests_passed","scope":"full","command":"pytest -q"},
           {"id":"c4","kind":"check_ran","command":"pytest -q","outcome":"passed"}]}
          ```

          Claim kinds:
          - `commit_pushed` (branch, sha): checked in git.
          - `files_changed` (paths): every path you changed or added, checked against `git diff base...sha`.
          - `tests_passed` (scope: full or subset, command, optional paths): decided by the Notary's own run, never by yours.
          - `check_ran` (command, outcome: passed or failed): checked against Switch's record of your commands.
            Run checks as one plain command: pipes, `;`, `&&` or redirects make the claim unverifiable.
          - `reviewed_diff` (sha): for reviewers; checked against Switch's record of a `git diff`/`git show` naming the sha.
          - `no_other_changes` (no fields): nothing changed beyond files_changed.

          Optional `cites`: evidence ids (`ev_...`) the Notary published for this work order.
          A bounce lists what to fix as codes, with the evidence ids behind each one.
links:
  - from: "{team}-desk"
    to: "{team}-work"
    label: work room
