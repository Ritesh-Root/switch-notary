name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: make verify-sample
      - run: python3 -I scripts/console-template.py --check
      - name: a one-byte edit to the sample receipt fails verification
        run: |
          sed '0,/priya/s//priyb/' samples/receipt-wo-1.json > /tmp/tampered.json
          if cargo run --quiet --release -p notary-core --bin notary-verify -- /tmp/tampered.json; then exit 1; fi
